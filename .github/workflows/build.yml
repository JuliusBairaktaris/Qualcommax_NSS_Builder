name: Build

# The ppe-nss images: OpenWrt from the ppe-nss branch with the vendor NSS Wi-Fi offload, for
# every ipq807x and ipq60xx device group (build-flavour.yml does the work). The vendor NSS
# stack (edma-nss releases) was last built from the archive/edma-nss-final tag of this repo.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'devices/**'
      - 'scripts/**'
      - '.github/workflows/build.yml'
      - '.github/workflows/build-flavour.yml'
  schedule:
    - cron: "0 */2 * * *"

permissions:
  contents: write

jobs:
  ppe-nss:
    uses: ./.github/workflows/build-flavour.yml
    secrets: inherit
    with:
      upstream_repo: JuliusBairaktaris/openwrt-ppe-nss
      upstream_ref: ppe-nss
      nss_repo: JuliusBairaktaris/nss-packages
      nss_ref: ppe-nss
      variant: ppe-nss
      release_prefix: ppe-nss
      title: OpenWrt ppe-nss
      # The ath11k memory profile is compile-time and image-wide, so boards share a build
      # only when they share a profile.
      devices: '["xiaomi_ax3600", "ipq807x-1g", "ipq807x-512m", "ipq807x-256m", "ipq60xx-1g", "ipq60xx-512m"]'
      # nss-firmware, and the luci fork carrying luci-app-qca-ppe-qos (openwrt/luci PR 8965),
      # which prepare-build.sh swaps in for the default luci feed.
      feeds: |
        src-git nss https://github.com/JuliusBairaktaris/nss-packages.git;ppe-nss
        src-git luci https://github.com/JuliusBairaktaris/luci.git;luci-app-ppe-qos
      notes: |
        Pick the `...-<your device>-squashfs-sysupgrade.bin` asset and flash
        it over an existing OpenWrt install. These are sysupgrade images only -
        there is no factory image; install stock OpenWrt first if you are not
        already running it.

        Wired offload runs in the PPE through the fw4 flowtable, switchdev
        and tc. The NSS Wi-Fi offload is on by default; turn it off with
        `uci set nss-wifi.general.offload=0; uci commit nss-wifi; reboot`.

        The images carry NSS firmware 12.5 and 11.4 and boot 12.5. 802.11s
        mesh needs 11.4, the last line that accepts a mesh interface:
        `uci set nss-wifi.general.firmware=11.4; uci commit nss-wifi; reboot`.
