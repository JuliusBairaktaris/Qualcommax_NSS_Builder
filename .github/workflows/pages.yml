name: Pages

# Republishes the image picker when its sources change, without a build.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/publish-site.sh'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Push to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PREFIX: ppe-nss
          PAGES_REPO: ppenss/ppenss.github.io
          PAGES_URL: https://ppenss.github.io
          PAGES_DEPLOY_KEY: ${{ secrets.PAGES_DEPLOY_KEY }}
        run: bash scripts/publish-site.sh
